<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CryptoPulse Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #e8eaf0; background: #090b10; }
    * { box-sizing: border-box; }
    body { margin: 0; background: radial-gradient(circle at top, #151a27 0%, #090b10 42%); min-height: 100vh; }
    .container { width: min(1200px, 92%); margin: 0 auto; padding: 32px 0 48px; }
    .header { display:flex; justify-content:space-between; gap:20px; align-items:end; margin-bottom:28px; }
    h1 { margin:0 0 7px; font-size: clamp(2rem, 4vw, 3.4rem); }
    .muted { color:#8e96a8; margin:0; }
    .status { display:flex; align-items:center; gap:8px; color:#9ca5b7; font-size:.92rem; }
    .dot { width:9px; height:9px; border-radius:50%; background:#35d07f; box-shadow:0 0 14px #35d07f; }
    .cards { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
    .card, .panel { background:rgba(20,24,34,.82); border:1px solid #272d3a; border-radius:18px; padding:20px; box-shadow:0 15px 40px rgba(0,0,0,.22); }
    .card h3 { margin:0 0 18px; color:#aeb6c6; font-size:.95rem; text-transform:uppercase; letter-spacing:.08em; }
    .price { font-size:2rem; font-weight:750; }
    .change { margin-top:8px; font-weight:650; }
    .up { color:#35d07f; } .down { color:#ff6b7d; }
    .grid { display:grid; grid-template-columns:2fr 1fr; gap:16px; margin-top:16px; }
    .panel h2 { margin-top:0; font-size:1.15rem; }
    canvas { width:100% !important; height:340px !important; }
    table { width:100%; border-collapse:collapse; }
    th, td { text-align:left; padding:12px 8px; border-bottom:1px solid #292f3b; font-size:.92rem; }
    th { color:#8e96a8; font-weight:600; }
    .timestamp { color:#8e96a8; font-size:.82rem; margin-top:14px; }
    @media (max-width: 820px) {
      .cards, .grid { grid-template-columns:1fr; }
      .header { align-items:flex-start; flex-direction:column; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="header">
      <div>
        <h1>CryptoPulse</h1>
        <p class="muted">Live dashboard powered by the stored crypto pipeline.</p>
      </div>
      <div class="status"><span class="dot"></span><span id="status">Updating…</span></div>
    </header>

    <section class="cards" id="cards"></section>

    <section class="grid">
      <div class="panel">
        <h2>Price History</h2>
        <canvas id="priceChart"></canvas>
      </div>
      <div class="panel">
        <h2>Latest Snapshot</h2>
        <div id="tableWrap"></div>
        <div class="timestamp" id="updated"></div>
      </div>
    </section>
  </main>

  <script>
    const coins = { bitcoin: "BTC", ethereum: "ETH", solana: "SOL" };
    let chart;

    function money(value) {
      return new Intl.NumberFormat("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 2 }).format(value);
    }

    function renderCards(rows) {
      const html = rows.map(r => {
        const cls = r.change_24h_pct >= 0 ? "up" : "down";
        const sign = r.change_24h_pct >= 0 ? "+" : "";
        return `
          <article class="card">
            <h3>${coins[r.coin] || r.coin}</h3>
            <div class="price">${money(r.price_usd)}</div>
            <div class="change ${cls}">${sign}${Number(r.change_24h_pct || 0).toFixed(2)}% (24h)</div>
          </article>`;
      }).join("");
      document.getElementById("cards").innerHTML = html;
    }

    function renderTable(rows) {
      document.getElementById("tableWrap").innerHTML = `
        <table>
          <thead><tr><th>Coin</th><th>Market Cap</th><th>24h Volume</th></tr></thead>
          <tbody>
            ${rows.map(r => `<tr><td>${coins[r.coin] || r.coin}</td><td>${money(r.market_cap_usd)}</td><td>${money(r.volume_24h_usd)}</td></tr>`).join("")}
          </tbody>
        </table>`;
    }

    function renderChart(rows) {
      const byCoin = {};
      rows.forEach(r => (byCoin[r.coin] ||= []).push(r));
      const colors = ["#7c5cff", "#22c55e", "#f59e0b"];
      const datasets = Object.entries(byCoin).map(([coin, values], i) => ({
        label: coins[coin] || coin,
        data: values.slice().reverse().map(v => ({ x: new Date(v.last_updated), y: v.price_usd })),
        borderColor: colors[i % colors.length],
        backgroundColor: colors[i % colors.length],
        tension: 0.28,
        pointRadius: 2
      }));
      if (chart) chart.destroy();
      chart = new Chart(document.getElementById("priceChart"), {
        type: "line",
        data: { datasets },
        options: {
          responsive: true,
          parsing: false,
          scales: {
            x: { type: "time", time: { unit: "day" }, ticks: { color: "#8e96a8" }, grid: { color: "#202633" } },
            y: { ticks: { color: "#8e96a8" }, grid: { color: "#202633" } }
          },
          plugins: { legend: { labels: { color: "#e8eaf0" } } }
        }
      });
    }

    async function refresh() {
      try {
        const [latestRes, historyRes] = await Promise.all([
          fetch("/api/latest"),
          fetch("/api/prices?limit=150")
        ]);
        if (!latestRes.ok || !historyRes.ok) throw new Error("API request failed");
        const latest = await latestRes.json();
        const history = await historyRes.json();
        renderCards(latest);
        renderTable(latest);
        renderChart(history);
        document.getElementById("updated").textContent =
          "Last dashboard refresh: " + new Date().toLocaleString();
        document.getElementById("status").textContent = "Live";
      } catch (error) {
        document.getElementById("status").textContent = "API unavailable";
        console.error(error);
      }
    }

    refresh();
    setInterval(refresh, 30000);
  </script>
</body>
</html>
