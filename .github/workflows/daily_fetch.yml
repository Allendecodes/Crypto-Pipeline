name: Daily Crypto Price Fetch

on:
  schedule:
    - cron: '0 3 * * *'   # runs every day at 3:00 AM UTC
  workflow_dispatch:        # lets you trigger it manually from GitHub's UI too

jobs:
  fetch-and-store:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests pandas

      - name: Run the pipeline
        run: python fetch_prices.py

      - name: Commit and push updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add crypto_data.db
          git commit -m "Automated daily price update" || echo "No changes to commit"
          git push